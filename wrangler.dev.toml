name = "cloudflare-workers-dotnet"
main = "src/WorkersDotNet/dist/worker.js"
compatibility_date = "2026-06-30"

# Local development config. It intentionally has NO [build] step: the C# worker
# and the Blazor static files are pre-compiled into src/WorkersDotNet/dist/ by
# cloudflarebuild.sh (run once before `wrangler dev`). Running the dotnet build
# through wrangler here causes an infinite restart loop on Windows because the
# build rewrites files under the watched repo root (obj/, bin/, .vs/, dist/).
#
# Rebuild before dev when Worker.cs / Blazor changes:
#   sh cloudflarebuild.sh        (or: dotnet publish src/WorkersDotNet -c Release)
# The [build] step in wrangler.toml (used for Cloudflare deploy) is unchanged.

# Serve the published BlazorWebApp as static files. worker.js handles
# server logic and falls back to these assets (and index.html for SPA routes).
[assets]
directory = "src/WorkersDotNet/dist/wwwroot"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# Origins allowed to call this worker cross-origin, as a comma-separated list.
# There is no wildcard: an origin must match exactly, and an empty list grants
# no cross-origin access at all.
#
# During local development the Blazor frontend is served by Aspire (or
# `dotnet run`) on port 5217 - pinned in src/Aspire/Aspire.AppHost/AppHost.cs -
# while the worker listens on http://localhost:8787, so the frontend origins must
# be listed here. Change the port in AppHost.cs and it has to be changed here too.
[vars]
ALLOWED_ORIGINS = "http://localhost:5217,https://localhost:7000"

# Enables the Cache API in local development. Without this `wrangler dev`
# answers caches.default.match() with "nothing cached" and silently drops
# caches.default.put(), so the cache sample could never show a hit locally.
[cache]
enabled = true

# ---------------------------------------------------------------------------
# Bindings used by the sample endpoints. `wrangler dev` simulates KV, R2 and
# queues locally, so all of these work without a Cloudflare account and without
# signing in. Their state is kept in .wrangler/state/v3/ and survives restarts;
# delete that folder to start from a clean slate.
# ---------------------------------------------------------------------------

# KV namespace "dotnet_test". It backs the KV sample itself, the queue consumer
# (key "queue_result") and the scheduled task (key "scheduled_result").
[[kv_namespaces]]
binding = "KV"
id = "dotnet_test"

# R2 bucket "dotnettest", holding the single object "sample_file.txt" of the R2
# sample.
[[r2_buckets]]
binding = "R2"
bucket_name = "dotnettest"

# Queue "dotnet-queue": the producer sample sends to it and the consumer sample
# reads from it. wrangler delivers the messages to the consumer in this same
# local process, so no account is involved.
[[queues.producers]]
binding = "QUEUE"
queue = "dotnet-queue"

[[queues.consumers]]
queue = "dotnet-queue"

# Fires the scheduled sample every hour. Cron events do not fire on their own in
# local dev; start with `wrangler dev --test-scheduled` to trigger one on demand
# with GET /__scheduled, or use the "Run now" button in the Blazor UI, which
# calls the exact same code through POST /api/scheduled.
[triggers]
crons = ["0 * * * *"]
