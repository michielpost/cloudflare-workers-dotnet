name = "cloudflare-workers-dotnet"
main = "src/WorkersDotNet/dist/worker.js"
compatibility_date = "2026-06-30"

# Serve the published BlazorWebApp as static files. worker.js handles
# server logic and falls back to these assets (and index.html for SPA routes).
[assets]
directory = "src/WorkersDotNet/dist/wwwroot"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[build]
# Apply pending remote D1 migrations before building and deploying the worker.
# Wrangler skips the confirmation prompt in non-interactive deploy builds.
command = "npx wrangler d1 migrations apply dotnet --remote && sh cloudflarebuild.sh"

# Origins allowed to call this worker cross-origin, as a comma-separated list.
# There is no wildcard: an origin must match exactly, and an empty list grants
# no cross-origin access at all.
#
# The deployed Blazor frontend is served by this same worker through the
# [assets] binding above, so its own calls are same-origin and need no entry.
# Add origins here only when the frontend is hosted somewhere else, e.g.
#   ALLOWED_ORIGINS = "https://my-frontend.pages.dev,https://app.example.com"
[vars]
ALLOWED_ORIGINS = ""

# The email that is automatically promoted to the "admin" role the first time an
# account with this address registers (see /api/auth/register). Set it to the
# email you want to be the default administrator, or leave blank to disable the
# auto-promotion.
DEFAULT_ADMIN_EMAIL = "admin@example.com"

# Enables the Cache API in local development. Without this `wrangler dev`
# answers caches.default.match() with "nothing cached" and silently drops
# caches.default.put(), so the cache sample could never show a hit locally.
[cache]
enabled = true

# ---------------------------------------------------------------------------
# Bindings used by the sample endpoints. All of them work locally
# (`wrangler dev` simulates KV, R2 and queues on this machine) without a
# Cloudflare account; the ids/names below are what the deployed resources must
# be called.
# ---------------------------------------------------------------------------

# KV namespace "dotnet_test". It backs the KV sample itself, the queue consumer
# (key "queue_result") and the scheduled task (key "scheduled_result").
# Always write to this namespace through the KV binding: wrangler keys the local
# copy by this id, so reads and writes keep hitting the same store.
# Run `npx wrangler kv namespace list` and paste the real id here to deploy.
[[kv_namespaces]]
binding = "KV"
id = "c9801713fc8e4b94b28ae07c17f91f53"

# R2 bucket "dotnettest", holding the single object "sample_file.txt" of the R2
# sample. Run `npx wrangler r2 bucket create dotnettest` to deploy it.
[[r2_buckets]]
binding = "R2"
bucket_name = "dotnettest"

# Queue "dotnet-queue": the producer sample sends to it and the consumer sample
# reads from it. Run `npx wrangler queues create dotnet-queue` to deploy it.
[[queues.producers]]
binding = "QUEUE"
queue = "dotnet-queue"

[[queues.consumers]]
queue = "dotnet-queue"

# D1 database "dotnet": the CRUD sample (table items) and the telemetry pipeline
# (tables sensors, readings, jobs). Create it with
#   npx wrangler d1 create dotnet
# and put the printed id here; then apply the schema to the deployed database with
#   npx wrangler d1 migrations apply dotnet --remote
[[d1_databases]]
binding = "DB"
database_name = "dotnet"
database_id = "39d2b30e-716f-4196-bb9e-70cb52d96628"
migrations_dir = "migrations"

# Queue "dotnet-telemetry": the telemetry pipeline's cron trigger sends sensor
# jobs to it and the queue consumer processes them. Create it with
#   npx wrangler queues create dotnet-telemetry
[[queues.producers]]
binding = "TELEMETRY"
queue = "dotnet-telemetry"

[[queues.consumers]]
queue = "dotnet-telemetry"
max_batch_size = 10
max_batch_timeout = 5

# Durable Object "RateGate": a single named instance that hands out a 30 second
# lease, so only one outbound weather API call is in flight at a time. Durable
# Objects need a migration, which is applied by the next `wrangler deploy`.
[[durable_objects.bindings]]
name = "RATE_GATE"
class_name = "RateGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateGate"]

# Fires the scheduled handlers: the scheduled-task sample every hour, and the
# telemetry pipeline every 5 minutes to poll the sensors that are due. Locally,
# `wrangler dev --test-scheduled` lets you trigger one on demand with
# GET /__scheduled?cron=*/5+*+*+*+*, and the buttons in the Blazor UI run the very
# same code through POST /api/scheduled and POST /api/telemetry/run.
[triggers]
crons = ["0 * * * *", "*/5 * * * *"]
